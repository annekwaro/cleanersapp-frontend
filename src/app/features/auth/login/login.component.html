<div class="bg-wash flex min-h-dvh flex-col px-4 py-5 sm:px-6">
  <header class="mx-auto flex w-full max-w-md items-center justify-between">
    <a routerLink="/" aria-label="Back to browsing"><app-logo /></a>
  </header>

  <main class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-8">
    <app-card-fan [compact]="true" class="mb-8" />
    <h1 class="font-display text-4xl font-bold leading-tight">Welcome <span class="text-brand-600">back</span></h1>
    <p class="mt-2 text-muted">Pick up where you left off — your matches and bookings are waiting.</p>

    <form (ngSubmit)="onSubmit()" class="mt-8 space-y-4">
      <div>
        <label class="label" for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required autocomplete="email"
          class="field" placeholder="you@example.com" />
      </div>
      <div>
        <label class="label" for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password"
          class="field" placeholder="••••••••" />
      </div>

      @if (error()) {
        <p class="flex items-start gap-2 rounded-2xl bg-clay-100 p-3 text-sm text-clay-500" role="alert">
          <app-icon name="alert" [size]="18" /> {{ error() }}
        </p>
      }

      <button type="submit" [disabled]="loading()" class="btn btn-primary w-full">
        {{ loading() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-muted">
      New here?
      <a routerLink="/register" class="font-semibold text-brand-700 hover:underline">Create an account</a>
      or <a routerLink="/" class="font-semibold text-brand-700 hover:underline">just browse</a>
    </p>
  </main>
</div>
