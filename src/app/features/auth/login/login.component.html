<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 p-4"
>
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">
      Welcome Back
    </h1>
    <p class="text-center text-gray-500 mb-6">
      Login to find your perfect cleaner
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Email</label
        >
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Password</label
        >
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
          placeholder="••••••••"
        />
      </div>

      @if (error()) {
      <div
        class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg p-3"
      >
        {{ error() }}
      </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-gradient-to-r from-pink-500 to-red-500 text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition disabled:opacity-50"
      >
        {{ loading() ? "Logging in..." : "Login" }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a
        routerLink="/register"
        class="text-pink-500 font-medium hover:underline"
        >Sign up</a
      >
    </p>
  </div>
</div>
