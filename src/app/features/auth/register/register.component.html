<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-500 via-red-500 to-yellow-500 py-8 p-4"
>
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">
      Create Account
    </h1>
    <p class="text-center text-gray-500 mb-6">Start matching today</p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >I am a</label
        >
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            (click)="role = 'HOMEOWNER'"
            [class.bg-pink-500]="role === 'HOMEOWNER'"
            [class.text-white]="role === 'HOMEOWNER'"
            [class.bg-gray-100]="role !== 'HOMEOWNER'"
            class="py-2.5 rounded-lg font-medium transition"
          >
            Homeowner
          </button>
          <button
            type="button"
            (click)="role = 'CLEANER'"
            [class.bg-pink-500]="role === 'CLEANER'"
            [class.text-white]="role === 'CLEANER'"
            [class.bg-gray-100]="role !== 'CLEANER'"
            class="py-2.5 rounded-lg font-medium transition"
          >
            Cleaner
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Full Name</label
        >
        <input
          type="text"
          [(ngModel)]="name"
          name="name"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
          placeholder="John Smith"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Email</label
        >
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Password</label
        >
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
          placeholder="••••••••"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
        <textarea
          [(ngModel)]="bio"
          name="bio"
          rows="2"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
          placeholder="Tell us a bit about yourself"
        ></textarea>
      </div>

      @if (role === 'CLEANER') {
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Hourly Rate ($)</label
        >
        <input
          type="number"
          [(ngModel)]="hourlyRate"
          name="hourlyRate"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 outline-none"
          placeholder="25"
        />
      </div>
      } @if (error()) {
      <div
        class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg p-3"
      >
        {{ error() }}
      </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-gradient-to-r from-pink-500 to-red-500 text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition disabled:opacity-50"
      >
        {{ loading() ? "Creating account..." : "Sign Up" }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-pink-500 font-medium hover:underline"
        >Login</a
      >
    </p>
  </div>
</div>
